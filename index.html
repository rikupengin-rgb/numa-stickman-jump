<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>沼ゲーのクソゲー</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background-color: #050b05;
      color: #00ff66;
      font-family: 'Courier New', Courier, monospace, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      padding: 10px;
    }

    /* メインコンテナ：画面幅からはみ出ないように設定 */
    .container {
      width: 100%;
      max-width: 400px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* タイトルロゴ */
    h1 {
      font-size: clamp(20px, 6vw, 28px);
      color: #00ff66;
      margin-bottom: 5px;
      white-space: nowrap;
      text-shadow: 0 0 8px rgba(0, 255, 102, 0.6);
    }

    .subtitle {
      font-size: clamp(12px, 3.5vw, 14px);
      color: #88cc88;
      margin-bottom: 20px;
    }

    /* モード選択ボタン一覧 */
    .menu-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
    }

    /* ボタン共通スタイル：フォントサイズを自動伸縮 */
    .btn {
      width: 100%;
      padding: 12px 8px;
      font-size: clamp(12px, 3.8vw, 16px);
      font-weight: bold;
      border-radius: 8px;
      background: rgba(0, 20, 0, 0.8);
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      word-break: break-all;
      text-align: center;
    }

    .btn-easy {
      border: 2px solid #28a745;
      color: #5cdb95;
    }
    .btn-normal {
      border: 2px solid #007bff;
      color: #64a6bd;
    }
    .btn-hard {
      border: 2px solid #dc3545;
      color: #ff6b6b;
    }
    .btn-endless {
      border: 2px solid #6f42c1;
      color: #d63384;
    }

    .btn:active {
      transform: scale(0.98);
      opacity: 0.8;
    }

    /* 注意書き・説明文 */
    .info-box {
      width: 100%;
      font-size: clamp(10px, 3.2vw, 13px);
      color: #ffcc00;
      line-height: 1.6;
      text-align: left;
      background: rgba(20, 20, 0, 0.5);
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #555000;
    }

    .info-item {
      display: flex;
      align-items: flex-start;
      gap: 4px;
      margin-bottom: 4px;
    }

    .controls-hint {
      margin-top: 8px;
      color: #888;
      text-align: center;
      font-size: clamp(10px, 3vw, 12px);
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>☣️ 沼ゲーのクソゲー</h1>
    <div class="subtitle">〜 モードを選択してスタート 〜</div>

    <div class="menu-list">
      <button class="btn btn-easy" onclick="startGame('easy')">🌱 イージー (5000mクリア)</button>
      <button class="btn btn-normal" onclick="startGame('normal')">⚔️ ノーマル (7000mクリア)</button>
      <button class="btn btn-hard" onclick="startGame('hard')">🔥 ハード (10000m/タライ有)</button>
      <button class="btn btn-endless" onclick="startGame('endless')">☣️ 終わりなき泥沼 (無限LvUp)</button>
    </div>

    <div class="info-box">
      <div class="info-item">⚠️ 泥沼モードは500mごとにレベルアップ</div>
      <div class="info-item">⚠️ ハード/高Lv泥沼は上からの「金タライ」に注意！</div>
      <div class="controls-hint">👉 左タップ: 左ジャンプ / 👈 右タップ: 右ジャンプ</div>
    </div>
  </div>

  <script>
    function startGame(mode) {
      alert(mode + " モードでスタートします！");
      // ここにゲーム開始の処理が入ります
    }
  </script>

</body>
</html>
