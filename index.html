<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>沼ゲーのクソゲー</title>
  <style>
    * {
      box-sizing: border-box !important;
      margin: 0;
      padding: 0;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #050b05;
      color: #00ff66;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", sans-serif;
      overflow: hidden;
      position: fixed;
    }
    #gameContainer {
      position: relative;
      width: 100vw;
      height: 100vh;
      max-width: 480px;
      margin: 0 auto;
      background: #020802;
      overflow: hidden;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    .overlay {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(5, 11, 5, 0.95);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px;
      z-index: 20;
    }
    .menu-card {
      width: 100%;
      max-width: 320px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    h1 {
      font-size: min(5.5vw, 22px);
      color: #00ff66;
      margin-bottom: 4px;
      text-shadow: 0 0 8px rgba(0, 255, 102, 0.6);
    }
    .subtitle {
      font-size: min(3.2vw, 12px);
      color: #88cc88;
      margin-bottom: 12px;
    }
    .menu-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 12px;
    }
    .btn {
      width: 100%;
      padding: 10px 6px;
      font-size: min(3.5vw, 13px);
      font-weight: bold;
      border-radius: 6px;
      background: rgba(0, 25, 0, 0.9);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .btn-easy { border: 2px solid #28a745; color: #5cdb95; }
    .btn-normal { border: 2px solid #007bff; color: #64a6bd; }
    .btn-hard { border: 2px solid #dc3545; color: #ff6b6b; }
    .btn-endless { border: 2px solid #6f42c1; color: #d63384; }
    .btn:active { transform: scale(0.97); opacity: 0.8; }
    .info-box {
      width: 100%;
      font-size: min(2.8vw, 11px);
      color: #ffcc00;
      line-height: 1.4;
      text-align: left;
      background: rgba(20, 20, 0, 0.7);
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #555000;
    }
    .controls-hint {
      margin-top: 4px;
      color: #aaa;
      text-align: center;
      font-size: min(2.6vw, 10px);
    }
    #touchLeft, #touchRight {
      position: absolute;
      top: 0; bottom: 0;
      width: 50%;
      z-index: 10;
    }
    #touchLeft { left: 0; }
    #touchRight { right: 0; }
  </style>
</head>
<body>

  <div id="gameContainer">
    <canvas id="gameCanvas"></canvas>

    <div id="touchLeft"></div>
    <div id="touchRight"></div>

    <div id="menuOverlay" class="overlay">
      <div class="menu-card">
        <h1>☣️ 沼ゲーのクソゲー</h1>
        <div class="subtitle">〜 モードを選択してスタート 〜</div>

        <div class="menu-list">
          <button class="btn btn-easy" onclick="startGame('easy')">🌱 イージー (1000m/爆弾無)</button>
          <button class="btn btn-normal" onclick="startGame('normal')">⚔️ ノーマル (1400mクリア)</button>
          <button class="btn btn-hard" onclick="startGame('hard')">🔥 ハード (2000m/タライ有)</button>
          <button class="btn btn-endless" onclick="startGame('endless')">☣️ 終わりなき泥沼 (無限LvUp)</button>
        </div>

        <div class="info-box">
          <div>🌱 イージーモードは爆弾なし！</div>
          <div>⚠️ 💣爆弾の逃げ場なし！飛び越えろ！</div>
          <div>⚠️ 足場配置が超ランダム理不尽仕様</div>
          <div class="controls-hint">👈 画面左タップ: 左2段ジャン / 画面右タップ: 右2段ジャン 👉</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const menuOverlay = document.getElementById('menuOverlay');

    function resize() {
      canvas.width = canvas.parentElement.clientWidth;
      canvas.height = canvas.parentElement.clientHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // --- Web Audio API (効果音) ---
    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playSound(type) {
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        const now = audioCtx.currentTime;

        if (type === 'jump') {
          osc.frequency.setValueAtTime(160, now);
          osc.frequency.exponentialRampToValueAtTime(450, now + 0.12);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.linearRampToValueAtTime(0, now + 0.12);
          osc.start(now); osc.stop(now + 0.12);
        } else if (type === 'jump2') {
          osc.frequency.setValueAtTime(320, now);
          osc.frequency.exponentialRampToValueAtTime(700, now + 0.12);
          gain.gain.setValueAtTime(0.25, now);
          gain.gain.linearRampToValueAtTime(0, now + 0.12);
          osc.start(now); osc.stop(now + 0.12);
        } else if (type === 'bomb') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(200, now);
          osc.frequency.linearRampToValueAtTime(40, now + 0.4);
          gain.gain.setValueAtTime(0.6, now);
          gain.gain.linearRampToValueAtTime(0, now + 0.4);
          osc.start(now); osc.stop(now + 0.4);
        } else if (type === 'tarai') {
          osc.type = 'square';
          osc.frequency.setValueAtTime(900, now);
          osc.frequency.linearRampToValueAtTime(150, now + 0.2);
          gain.gain.setValueAtTime(0.5, now);
          gain.gain.linearRampToValueAtTime(0, now + 0.2);
          osc.start(now); osc.stop(now + 0.2);
        }
      } catch(e){}
    }

    // --- ゲーム状態変数 ---
    let isPlaying = false;
    let animId = null;
    let mode = 'normal';
    let targetDepth = 1400;
    let depth = 0;
    let record = 0;

    let player = {
      x: 0, y: 0, vx: 0, vy: 0, radius: 10,
      jumpCount: 0, maxJumps: 2
    };

    let platforms = [];
    let basins = [];

    function startGame(selectedMode) {
      initAudio();
      if (animId) cancelAnimationFrame(animId);

      mode = selectedMode;
      if (mode === 'easy') targetDepth = 1000;
      else if (mode === 'normal') targetDepth = 1400;
      else if (mode === 'hard') targetDepth = 2000;
      else targetDepth = Infinity;

      depth = 0;
      isPlaying = true;
      menuOverlay.style.display = 'none';

      player.x = canvas.width / 2;
      player.y = canvas.height - 120;
      player.vx = 0;
      player.vy = 0;
      player.jumpCount = 0;

      // 初期足場
      platforms = [{ x: canvas.width / 2 - 40, y: canvas.height - 60, w: 80, h: 12, type: 'normal', vx: 0, timer: 0, broken: false }];
      for (let i = 1; i < 15; i++) {
        spawnPlatform(canvas.height - 60 - i * 75);
      }
      basins = [];
      loop();
    }

    // 足場生成アルゴリズム（超クソゲーランダム化）
    function spawnPlatform(yPos) {
      // 足場の幅をランダムに変化（50px〜70px）
      let pWidth = 50 + Math.random() * 20;
      let canBomb = (mode !== 'easy');
      let r = Math.random();

      // 完全ランダムなX座標配置（画面端から端まで自由に出現）
      let px = 10 + Math.random() * (canvas.width - pWidth - 20);

      let type = 'normal';

      // 爆弾足場の生成（避難ルートなし！）
      if (canBomb && r < 0.25) {
        type = 'bomb';
      } else {
        let typeRand = Math.random();
        if (typeRand < 0.30) type = 'normal';
        else if (typeRand < 0.55) type = 'swamp';
        else if (typeRand < 0.80) type = 'moving';
        else type = 'vanish';
      }

      platforms.push({
        x: px,
        y: yPos,
        w: pWidth,
        h: 12,
        type: type,
        // 動く床の速度をランダム化（2.0〜4.5）
        vx: type === 'moving' ? (Math.random() < 0.5 ? 1 : -1) * (2.0 + Math.random() * 2.5) : 0,
        timer: 0,
        broken: false
      });
    }

    function handleJump(dir) {
      if (!isPlaying) return;
      initAudio();
      if (player.jumpCount < player.maxJumps) {
        player.vy = -13.5;
        player.vx = dir * 6.0;
        if (player.jumpCount === 0) playSound('jump');
        else playSound('jump2');
        player.jumpCount++;
      }
    }

    const touchL = document.getElementById('touchLeft');
    const touchR = document.getElementById('touchRight');

    touchL.addEventListener('touchstart', (e) => { e.preventDefault(); handleJump(-1); }, {passive: false});
    touchR.addEventListener('touchstart', (e) => { e.preventDefault(); handleJump(1); }, {passive: false});
    touchL.addEventListener('mousedown', () => handleJump(-1));
    touchR.addEventListener('mousedown', () => handleJump(1));

    // メインゲームループ
    function loop() {
      if (!isPlaying) return;

      // 物理演算
      player.vy += 0.5; 
      player.x += player.vx;
      player.y += player.vy;
      player.vx *= 0.82;

      // 壁判定
      if (player.x - player.radius < 0) { player.x = player.radius; player.vx = 0; }
      if (player.x + player.radius > canvas.width) { player.x = canvas.width - player.radius; player.vx = 0; }

      // カメラ移動
      if (player.y < canvas.height * 0.45) {
        let diff = canvas.height * 0.45 - player.y;
        player.y = canvas.height * 0.45;
        depth += Math.floor(diff / 2);
        if (depth > record) record = depth;

        platforms.forEach(p => p.y += diff);
        basins.forEach(b => b.y += diff);

        while (platforms[platforms.length - 1].y > 0) {
          spawnPlatform(platforms[platforms.length - 1].y - 75);
        }
      }

      // 金タライの発生
      let taraiChance = (mode === 'hard') ? 0.015 : (mode === 'endless' ? 0.008 + (depth / 6000) : 0);
      if (Math.random() < taraiChance) {
        basins.push({ x: Math.random() * (canvas.width - 30), y: -30, vy: 7.0 });
      }

      // 足場との判定
      platforms.forEach(p => {
        if (p.broken) return;

        if (p.type === 'moving') {
          p.x += p.vx;
          if (p.x < 5 || p.x + p.w > canvas.width - 5) p.vx *= -1;
        }

        // 着地判定
        if (player.vy >= 0 &&
            player.x + player.radius > p.x && player.x - player.radius < p.x + p.w &&
            player.y + player.radius >= p.y && player.y - player.radius < p.y + p.h + 2) {

          // 💣 爆弾足場：判定
          if (p.type === 'bomb') {
            let bombMargin = 12;
            if (player.x > p.x + bombMargin && player.x < p.x + p.w - bombMargin) {
              p.broken = true;
              playSound('bomb');
              gameOver("💣 爆弾を踏んで爆死！");
              return;
            }
          }

          if (p.type === 'swamp') {
            player.vy = 1.0; // 沼：沈む
            player.jumpCount = 0;
          } else {
            player.y = p.y - player.radius;
            player.vy = 0;
            player.vx = 0; // 着地時ピタッと停止
            player.jumpCount = 0; // 2段ジャンプリセット

            if (p.type === 'moving') {
              player.x += p.vx;
            }

            if (p.type === 'vanish') {
              p.timer++;
              if (p.timer > 5) p.broken = true; // 消える速度アップ
            }
          }
        }
      });

      // 金タライ判定
      basins.forEach(b => {
        b.y += b.vy;
        if (Math.abs(player.x - (b.x + 15)) < 18 && Math.abs(player.y - (b.y + 10)) < 18) {
          playSound('tarai');
          gameOver("金タライ直撃！");
        }
      });

      // 落下ゲームオーバー
      if (player.y > canvas.height + 40) {
        gameOver("沼の底に沈んだ...");
        return;
      }

      // クリアチェック
      if (depth >= targetDepth) {
        alert("🎉 クリア達成！ 到達度: " + depth + "m");
        menuOverlay.style.display = 'flex';
        isPlaying = false;
        return;
      }

      // 描画処理
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 足場描画
      platforms.forEach(p => {
        if (p.broken) return;
        if (p.type === 'normal') ctx.fillStyle = '#28a745';
        else if (p.type === 'swamp') ctx.fillStyle = '#8B4513';
        else if (p.type === 'moving') ctx.fillStyle = '#17a2b8';
        else if (p.type === 'vanish') ctx.fillStyle = '#ffc107';
        else if (p.type === 'bomb') ctx.fillStyle = '#dc3545';
        
        ctx.fillRect(p.x, p.y, p.w, p.h);

        if (p.type === 'bomb') {
          ctx.fillStyle = '#fff';
          ctx.font = '10px sans-serif';
          ctx.fillText('💣', p.x + p.w/2 - 6, p.y + 10);
        }
      });

      // タライ描画
      ctx.fillStyle = '#ffd700';
      basins.forEach(b => ctx.fillRect(b.x, b.y, 30, 14));

      // 棒人間描画
      ctx.strokeStyle = '#00ff66';
      ctx.lineWidth = 2.5;
      
      // 頭
      ctx.beginPath();
      ctx.arc(player.x, player.y - 14, 7, 0, Math.PI * 2);
      ctx.stroke();

      // 胴体
      ctx.beginPath();
      ctx.moveTo(player.x, player.y - 7);
      ctx.lineTo(player.x, player.y + 5);
      ctx.stroke();

      // 腕
      ctx.beginPath();
      if (player.vy < 0) {
        ctx.moveTo(player.x, player.y - 2);
        ctx.lineTo(player.x - 9, player.y - 12);
        ctx.moveTo(player.x, player.y - 2);
        ctx.lineTo(player.x + 9, player.y - 12);
      } else {
        ctx.moveTo(player.x, player.y - 2);
        ctx.lineTo(player.x - 8, player.y + 4);
        ctx.moveTo(player.x, player.y - 2);
        ctx.lineTo(player.x + 8, player.y + 4);
      }
      ctx.stroke();

      // 脚
      ctx.beginPath();
      ctx.moveTo(player.x, player.y + 5);
      ctx.lineTo(player.x - 6, player.y + 16);
      ctx.moveTo(player.x, player.y + 5);
      ctx.lineTo(player.x + 6, player.y + 16);
      ctx.stroke();

      // UI表示
      ctx.fillStyle = '#00ff66';
      ctx.font = 'bold 13px monospace';
      ctx.fillText(`DEPTH: ${depth}m`, 12, 25);
      ctx.fillText(`TARGET: ${targetDepth === Infinity ? '無限' : targetDepth + 'm'}`, 12, 42);

      animId = requestAnimationFrame(loop);
    }

    function gameOver(reason) {
      isPlaying = false;
      alert(`GAME OVER (${reason})\n記録: ${depth}m`);
      menuOverlay.style.display = 'flex';
    }
  </script>
</body>
</html>
