<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>沼ゲーのクソゲー</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      background-color: #050b05;
      color: #00ff66;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #gameContainer {
      position: relative;
      width: 100vw;
      height: 100vh;
      max-width: 480px;
      max-height: 850px;
      background: #020802;
      overflow: hidden;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* メニュー画面オーバーレイ */
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(5, 11, 5, 0.94);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px;
      z-index: 10;
    }

    .menu-card {
      width: 92%;
      max-width: 320px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      font-size: clamp(16px, 5vw, 22px);
      color: #00ff66;
      margin-bottom: 4px;
      text-shadow: 0 0 8px rgba(0, 255, 102, 0.6);
    }

    .subtitle {
      font-size: clamp(10px, 3vw, 12px);
      color: #88cc88;
      margin-bottom: 14px;
    }

    .menu-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 14px;
    }

    .btn {
      width: 100%;
      padding: 10px 4px;
      font-size: clamp(11px, 3.2vw, 14px);
      font-weight: bold;
      border-radius: 8px;
      background: rgba(0, 20, 0, 0.85);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .btn-easy { border: 2px solid #28a745; color: #5cdb95; }
    .btn-normal { border: 2px solid #007bff; color: #64a6bd; }
    .btn-hard { border: 2px solid #dc3545; color: #ff6b6b; }
    .btn-endless { border: 2px solid #6f42c1; color: #d63384; }

    .btn:active { transform: scale(0.96); opacity: 0.8; }

    .info-box {
      width: 100%;
      font-size: clamp(9px, 2.8vw, 11px);
      color: #ffcc00;
      line-height: 1.4;
      text-align: left;
      background: rgba(20, 20, 0, 0.6);
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #555000;
    }

    .controls-hint {
      margin-top: 4px;
      color: #aaa;
      text-align: center;
      font-size: clamp(9px, 2.6vw, 10px);
    }

    /* タップ用透明操作エリア */
    #touchLeft, #touchRight {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 50%;
      z-index: 5;
    }
    #touchLeft { left: 0; }
    #touchRight { right: 0; }
  </style>
</head>
<body>

  <div id="gameContainer">
    <canvas id="gameCanvas"></canvas>

    <!-- タップ判定エリア -->
    <div id="touchLeft"></div>
    <div id="touchRight"></div>

    <!-- メニュー画面 -->
    <div id="menuOverlay" class="overlay">
      <div class="menu-card">
        <h1>☣️ 沼ゲーのクソゲー</h1>
        <div class="subtitle">〜 モードを選択してスタート 〜</div>

        <div class="menu-list">
          <button class="btn btn-easy" onclick="startGame('easy')">🌱 イージー (5000mクリア)</button>
          <button class="btn btn-normal" onclick="startGame('normal')">⚔️ ノーマル (7000mクリア)</button>
          <button class="btn btn-hard" onclick="startGame('hard')">🔥 ハード (10000m/タライ有)</button>
          <button class="btn btn-endless" onclick="startGame('endless')">☣️ 終わりなき泥沼 (無限LvUp)</button>
        </div>

        <div class="info-box">
          <div>⚠️ 泥沼モードは500mごとにレベルアップ</div>
          <div>⚠️ ハード/高Lv泥沼は上からの「金タライ」に注意！</div>
          <div class="controls-hint">👈 画面左タップ: 左ジャンプ / 画面右タップ: 右ジャンプ 👉</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const menuOverlay = document.getElementById('menuOverlay');

    function resize() {
      canvas.width = canvas.parentElement.clientWidth;
      canvas.height = canvas.parentElement.clientHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // ゲーム変数
    let isPlaying = false;
    let mode = 'normal';
    let targetDepth = 7000;
    let depth = 0;
    let record = 0;

    let player = { x: 0, y: 0, vx: 0, vy: 0, radius: 12, onGround: false };
    let platforms = [];
    let basins = [];
    let cameraY = 0;

    function startGame(selectedMode) {
      mode = selectedMode;
      if (mode === 'easy') targetDepth = 5000;
      else if (mode === 'normal') targetDepth = 7000;
      else if (mode === 'hard') targetDepth = 10000;
      else targetDepth = Infinity;

      depth = 0;
      isPlaying = true;
      menuOverlay.style.display = 'none';

      // プレイヤー初期化
      player.x = canvas.width / 2;
      player.y = canvas.height - 100;
      player.vx = 0;
      player.vy = 0;

      // 足場生成
      platforms = [{ x: canvas.width / 2 - 40, y: canvas.height - 60, w: 80, h: 12 }];
      for (let i = 1; i < 20; i++) {
        platforms.push({
          x: Math.random() * (canvas.width - 70),
          y: canvas.height - 60 - i * 80,
          w: 70,
          h: 12
        });
      }
      basins = [];
      loop();
    }

    // タップ操作
    document.getElementById('touchLeft').addEventListener('touchstart', (e) => {
      e.preventDefault();
      if (isPlaying && player.onGround) {
        player.vy = -12;
        player.vx = -5;
        player.onGround = false;
      }
    });

    document.getElementById('touchRight').addEventListener('touchstart', (e) => {
      e.preventDefault();
      if (isPlaying && player.onGround) {
        player.vy = -12;
        player.vx = 5;
        player.onGround = false;
      }
    });

    function loop() {
      if (!isPlaying) return;

      // 物理計算
      player.vy += 0.5; // 重力
      player.x += player.vx;
      player.y += player.vy;
      player.vx *= 0.95;

      // 壁反射
      if (player.x < 10) { player.x = 10; player.vx *= -1; }
      if (player.x > canvas.width - 10) { player.x = canvas.width - 10; player.vx *= -1; }

      // カメラ＆深度移動
      if (player.y < canvas.height / 2) {
        let diff = canvas.height / 2 - player.y;
        player.y = canvas.height / 2;
        depth += Math.floor(diff);
        if (depth > record) record = depth;

        // 足場を下にスライド
        platforms.forEach(p => p.y += diff);
        basins.forEach(b => b.y += diff);

        // 新しい足場追加
        while (platforms[platforms.length - 1].y > 0) {
          platforms.push({
            x: Math.random() * (canvas.width - 70),
            y: platforms[platforms.length - 1].y - 80,
            w: 70,
            h: 12
          });
        }
      }

      // 金タライの発生（ハード・泥沼モード）
      if ((mode === 'hard' || mode === 'endless') && Math.random() < 0.02) {
        basins.push({ x: Math.random() * (canvas.width - 30), y: -30, vy: 6 });
      }

      // 足場との当たり判定
      player.onGround = false;
      platforms.forEach(p => {
        if (player.vy > 0 &&
            player.x > p.x && player.x < p.x + p.w &&
            player.y + player.radius >= p.y && player.y - player.radius < p.y) {
          player.y = p.y - player.radius;
          player.vy = 0;
          player.vx = 0;
          player.onGround = true;
        }
      });

      // タライ落下・判定
      basins.forEach(b => {
        b.y += b.vy;
        // プレイヤー直撃判定
        if (Math.abs(player.x - (b.x + 15)) < 20 && Math.abs(player.y - (b.y + 10)) < 20) {
          gameOver("金タライ直撃！");
        }
      });

      // 画面外落下判定
      if (player.y > canvas.height + 50) {
        gameOver("沼に落ちた！");
      }

      // クリア判定
      if (depth >= targetDepth) {
        alert("🎉 クリア達成！深さ: " + depth + "m");
        menuOverlay.style.display = 'flex';
        isPlaying = false;
        return;
      }

      // 描画
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 足場描画
      ctx.fillStyle = '#28a745';
      platforms.forEach(p => ctx.fillRect(p.x, p.y, p.w, p.h));

      // 金タライ描画
      ctx.fillStyle = '#ffd700';
      basins.forEach(b => ctx.fillRect(b.x, b.y, 30, 15));

      // 棒人間描画
      ctx.strokeStyle = '#00ff66';
      ctx.lineWidth = 3;
      // 頭
      ctx.beginPath();
      ctx.arc(player.x, player.y - 12, 6, 0, Math.PI * 2);
      ctx.stroke();
      // 胴体
      ctx.beginPath();
      ctx.moveTo(player.x, player.y - 6);
      ctx.lineTo(player.x, player.y + 6);
      ctx.stroke();

      // UI
      ctx.fillStyle = '#00ff66';
      ctx.font = 'bold 14px monospace';
      ctx.fillText(`DEPTH: ${depth}m`, 15, 30);
      ctx.fillText(`TARGET: ${targetDepth === Infinity ? '無限' : targetDepth + 'm'}`, 15, 50);

      requestAnimationFrame(loop);
    }

    function gameOver(reason) {
      isPlaying = false;
      alert(`GAME OVER (${reason})\n到達: ${depth}m`);
      menuOverlay.style.display = 'flex';
    }
  </script>
</body>
</html>
