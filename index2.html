<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  
  <!-- PWA・全画面表示用の設定 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="沼ゲーのクソゲー">
  <meta name="mobile-web-app-capable" content="yes">

  <!-- ホーム画面アイコン -->
  <link rel="apple-touch-icon" href="https://api.iconify.design/emojione-v1:biohazard-symbol.svg">

  <title>沼ゲーのクソゲー</title>
  <style>
    * { touch-action: manipulation; -webkit-user-select: none; user-select: none; box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #0a0e08;
      color: #fff;
      font-family: sans-serif;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    canvas {
      background: #050a05;
      display: block;
      width: 100%;
      height: 100%;
      max-width: 100vw;
      max-height: 100vh;
      object-fit: contain;
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    
    const W = 400;
    const H = 700;
    canvas.width = W;
    canvas.height = H;

    let state = 'TITLE';
    let currentModeKey = 'NORMAL';
    let currentLevel = 1;
    let player, cameraY, score, highScore = 0;
    let platforms = [], obstacles = [], particles = [], popups = [], jumpEffects = [];
    let shakeTime = 0;

    // モード設定
    const MODES = {
      EASY:    { name: '🌱 イージー (5000mクリア)', target: 5000, swampProb: 0.15, bombProb: 0, minW: 100, maxW: 140, color: '#4CAF50', tarai: false },
      NORMAL:  { name: '⚔️️ ノーマル (7000mクリア)', target: 7000, swampProb: 0.25, bombProb: 0.10, minW: 80, maxW: 115, color: '#2196F3', tarai: false },
      HARD:    { name: '🔥 ハード (10000m/タライ有)', target: 10000, swampProb: 0.35, bombProb: 0.18, minW: 65, maxW: 90, color: '#F44336', tarai: true },
      ENDLESS: { name: '☣️ 終わりなき泥沼 (無限LvUP)', target: Infinity, swampProb: 0.20, bombProb: 0.08, minW: 85, maxW: 120, color: '#9C27B0', tarai: false }
    };

    const modeButtons = [
      { key: 'EASY', y: 230 },
      { key: 'NORMAL', y: 300 },
      { key: 'HARD', y: 370 },
      { key: 'ENDLESS', y: 440 }
    ];

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        const now = audioCtx.currentTime;
        if (type === 'jump') {
          osc.frequency.setValueAtTime(350, now);
          osc.frequency.exponentialRampToValueAtTime(700, now + 0.08);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
          osc.start(now); osc.stop(now + 0.08);
        } else if (type === 'swamp') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(120, now);
          osc.frequency.linearRampToValueAtTime(60, now + 0.15);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
          osc.start(now); osc.stop(now + 0.15);
        } else if (type === 'bomb') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(160, now);
          osc.frequency.linearRampToValueAtTime(20, now + 0.25);
          gain.gain.setValueAtTime(0.3, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
          osc.start(now); osc.stop(now + 0.25);
        } else if (type === 'clear' || type === 'levelup') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.setValueAtTime(659.25, now + 0.08);
          osc.frequency.setValueAtTime(783.99, now + 0.16);
          osc.frequency.setValueAtTime(1046.50, now + 0.24);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.4);
          osc.start(now); osc.stop(now + 0.4);
        }
      } catch(e) {}
    }

    function init(modeKey) {
      currentModeKey = modeKey || 'NORMAL';
      currentLevel = 1;
      player = { x: W / 2, y: H - 100, vx: 0, vy: 0, jumpsLeft: 2, dead: false, parts: [], sinkDepth: 0 };
      cameraY = 0; score = 0;
      platforms = []; obstacles = []; particles = []; popups = []; jumpEffects = []; shakeTime = 0;

      platforms.push({ x: W / 2 - 60, y: H - 60, w: 120, h: 16, type: 'NORMAL', text: 'START', vx: 0, sink: 0 });

      let curY = H - 130;
      for (let i = 0; i < 14; i++) {
        addPlatform(curY);
        curY -= 65 + Math.random() * 20;
      }
    }

    function addPlatform(y) {
      let mode = MODES[currentModeKey];
      let swampProb = mode.swampProb;
      let bombProb = mode.bombProb;
      let minW = mode.minW;
      let maxW = mode.maxW;

      // 泥沼モード：レベルに応じて高難易度化
      if (currentModeKey === 'ENDLESS') {
        bombProb = Math.min(0.25, 0.05 + currentLevel * 0.02);
        swampProb = Math.min(0.40, 0.18 + currentLevel * 0.025);
        minW = Math.max(45, 85 - currentLevel * 4);
        maxW = Math.max(70, 120 - currentLevel * 5);
      }

      let rand = Math.random();
      let type = 'NORMAL';
      
      const bombThresh = bombProb;
      const swampThresh = bombThresh + swampProb;
      const movingThresh = swampThresh + 0.15;
      const disappearThresh = movingThresh + 0.12;

      if (rand < bombThresh) type = 'BOMB';
      else if (rand < swampThresh) type = 'SWAMP';
      else if (rand < movingThresh) type = 'MOVING';
      else if (rand < disappearThresh) type = 'DISAPPEAR';
      else type = 'NORMAL';

      const w = minW + Math.random() * (maxW - minW);
      const x = Math.random() * (W - w);
      const vx = (type === 'MOVING') ? (Math.random() > 0.5 ? (1.8 + currentLevel * 0.1) : -(1.8 + currentLevel * 0.1)) : 0;
      
      let text = 'SAFE!';
      if (type === 'SWAMP') text = '⚠️ 沼';
      else if (type === 'BOMB') text = '❓';
      else if (type === 'DISAPPEAR') text = '❓';

      platforms.push({ x, y, w, h: 16, type, text, vx, sink: 0 });
    }

    function killPlayer(reason = '爆破！') {
      if (player.dead) return;
      player.dead = true;
      state = 'GAMEOVER';
      playSound('bomb');
      shakeTime = 16;

      for (let i = 0; i < 25; i++) {
        particles.push({
          x: player.x, y: player.y,
          vx: (Math.random() - 0.5) * 10,
          vy: (Math.random() - 0.5) * 10,
          size: Math.random() * 6 + 3,
          color: reason.includes('沼') ? '#4a5d23' : '#ff3333',
          life: 25
        });
      }
      popups.push({ x: player.x, y: player.y - 20, text: `💥 ${reason}`, life: 40, vy: -2, color: '#ff4444' });

      player.parts = [
        { x: player.x, y: player.y - 18, vx: (Math.random()-0.5)*8, vy: -7, type: 'head' },
        { x: player.x, y: player.y - 5, vx: (Math.random()-0.5)*8, vy: -5, type: 'line' },
        { x: player.x, y: player.y + 10, vx: (Math.random()-0.5)*8, vy: -4, type: 'line' }
      ];
    }

    function gameClear() {
      if (state === 'CLEAR') return;
      state = 'CLEAR';
      playSound('clear');
      for (let i = 0; i < 60; i++) {
        particles.push({
          x: W / 2, y: H / 2,
          vx: (Math.random() - 0.5) * 14,
          vy: (Math.random() - 0.5) * 14,
          size: Math.random() * 8 + 4,
          color: ['#ffeb3b', '#4caf50', '#00bcd4', '#e91e63'][Math.floor(Math.random() * 4)],
          life: 60
        });
      }
    }

    function update() {
      if (shakeTime > 0) shakeTime--;

      if (state === 'PLAY') {
        player.vy += 0.32;
        player.vx *= 0.93;
        player.y += player.vy;
        player.x += player.vx;

        if (player.x < 15) { player.x = 15; player.vx *= -0.5; }
        if (player.x > W - 15) { player.x = W - 15; player.vx *= -0.5; }

        if (player.y < cameraY + H * 0.45) {
          let diff = (cameraY + H * 0.45) - player.y;
          cameraY -= diff;
          score = Math.floor(-cameraY);
          if (score > highScore) highScore = score;

          // 泥沼モードのレベルアップ処理 (500mごと)
          if (currentModeKey === 'ENDLESS') {
            let calculatedLevel = Math.floor(score / 500) + 1;
            if (calculatedLevel > currentLevel) {
              currentLevel = calculatedLevel;
              playSound('levelup');
              popups.push({ x: W / 2, y: cameraY + H * 0.3, text: `🔥 LEVEL UP! Lv.${currentLevel}`, life: 50, vy: -1.5, color: '#ffeb3b' });
            }
          }

          // クリア判定（クリア制モードのみ）
          const mode = MODES[currentModeKey];
          if (mode.target !== Infinity && score >= mode.target) {
            gameClear();
          }
        }

        // タライ（障害物）落下処理（ハード、または泥沼Lv.3以上）
        const isHardTarai = currentModeKey === 'HARD';
        const isEndlessTarai = (currentModeKey === 'ENDLESS' && currentLevel >= 3);
        
        if (isHardTarai || isEndlessTarai) {
          let taraiChance = isHardTarai ? 0.015 : 0.008 + (currentLevel * 0.003);
          if (Math.random() < taraiChance) {
            obstacles.push({
              x: Math.random() * (W - 35) + 5,
              y: cameraY - 40,
              vy: 4.5 + Math.random() * 2.5,
              w: 32,
              h: 16
            });
          }
        }

        // 障害物の位置更新と接触判定
        obstacles.forEach(o => {
          o.y += o.vy;
          if (
            player.x + 8 > o.x &&
            player.x - 8 < o.x + o.w &&
            player.y + 16 > o.y &&
            player.y - 16 < o.y + o.h &&
            !player.dead
          ) {
            killPlayer('金タライ直撃！');
          }
        });
        obstacles = obstacles.filter(o => o.y < cameraY + H + 50);

        let minY = Math.min(...platforms.map(p => p.y));
        while (minY > cameraY - 100) {
          minY -= 65 + Math.random() * 20;
          addPlatform(minY);
        }
        platforms = platforms.filter(p => p.y < cameraY + H + 100);

        platforms.forEach(p => {
          if (p.type === 'MOVING') {
            p.x += p.vx;
            if (p.x < 10 || p.x + p.w > W - 10) p.vx *= -1;
          }
        });

        // 着地・沼判定
        if (player.vy >= 0) {
          platforms.forEach(p => {
            if (
              player.x + 10 > p.x &&
              player.x - 10 < p.x + p.w &&
              player.y + 18 >= p.y + p.sink &&
              player.y + 18 <= p.y + p.h + p.sink + player.vy + 2
            ) {
              if (p.type === 'BOMB') {
                killPlayer('爆弾を踏んだ！');
              } else if (p.type === 'DISAPPEAR') {
                p.y = 99999;
                popups.push({ x: player.x, y: player.y, text: '底が抜けた！', life: 25, vy: -1, color: '#aaa' });
              } else if (p.type === 'SWAMP') {
                p.sink += 0.8;
                player.y = p.y + p.sink - 18;
                player.vy = 0;
                player.jumpsLeft = 2;

                if (Math.random() < 0.15) playSound('swamp');

                if (p.sink > 22) {
                  killPlayer('沼に呑まれた！');
                }
              } else {
                player.y = p.y - 18;
                player.vy = 0;
                player.vx = 0;
                player.jumpsLeft = 2;
                if (p.type === 'MOVING') player.x += p.vx;
              }
            }
          });
        }

        if (player.y > cameraY + H + 50) killPlayer('落下した！');
      }

      if (player && player.parts) {
        player.parts.forEach(pt => { pt.vy += 0.4; pt.x += pt.vx; pt.y += pt.vy; });
      }

      particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.life--; });
      particles = particles.filter(p => p.life > 0);

      jumpEffects.forEach(e => { e.r += 1.5; e.alpha -= 0.08; });
      jumpEffects = jumpEffects.filter(e => e.alpha > 0);

      popups.forEach(p => { p.y += p.vy; p.life--; });
      popups = popups.filter(p => p.life > 0);
    }

    function drawStickman(x, y, vy, dead) {
      if (dead) return;
      ctx.strokeStyle = '#66ff66';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.arc(x, y - 16, 6, 0, Math.PI * 2);
      ctx.moveTo(x, y - 10); ctx.lineTo(x, y + 4);
      let armY = vy < 0 ? y - 14 : y - 4;
      ctx.moveTo(x - 9, armY); ctx.lineTo(x, y - 6); ctx.lineTo(x + 9, armY);
      let legX = vy < 0 ? 7 : 4;
      ctx.moveTo(x - legX, y + 16); ctx.lineTo(x, y + 4); ctx.lineTo(x + legX, y + 16);
      ctx.stroke();
    }

    function draw() {
      ctx.save();
      if (shakeTime > 0) ctx.translate((Math.random() - 0.5) * 8, (Math.random() - 0.5) * 8);

      ctx.fillStyle = '#071007';
      ctx.fillRect(0, 0, W, H);

      ctx.save();
      ctx.translate(0, -cameraY);

      platforms.forEach(p => {
        let color = '#2a3a2a', border = '#4a6a4a', txt = p.text;
        
        if (p.type === 'SWAMP') {
          color = '#3b2d13';
          border = '#8c6b2d';
          txt = '⚠️ 沼 (ズブズブ)';
        } else if (p.type === 'BOMB') {
          color = '#4a1a1a';
          border = '#aa3333';
        }

        ctx.fillStyle = color; 
        ctx.fillRect(p.x, p.y + p.sink, p.w, p.h);
        ctx.strokeStyle = border; 
        ctx.lineWidth = 1.5; 
        ctx.strokeRect(p.x, p.y + p.sink, p.w, p.h);

        ctx.fillStyle = '#aaffaa'; ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'center';
        ctx.fillText(txt, p.x + p.w / 2, p.y + p.sink + 12);
      });

      // 落下金タライの描画
      obstacles.forEach(o => {
        ctx.fillStyle = '#d1c4e9';
        ctx.beginPath();
        ctx.moveTo(o.x, o.y);
        ctx.lineTo(o.x + o.w, o.y);
        ctx.lineTo(o.x + o.w - 4, o.y + o.h);
        ctx.lineTo(o.x + 4, o.y + o.h);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = '#7e57c2';
        ctx.lineWidth = 2;
        ctx.stroke();
        
        // タライのフチ
        ctx.fillStyle = '#b388ff';
        ctx.fillRect(o.x - 2, o.y, o.w + 4, 4);
      });

      jumpEffects.forEach(e => {
        ctx.strokeStyle = `rgba(100, 255, 100, ${e.alpha})`;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2);
        ctx.stroke();
      });

      if (player) {
        drawStickman(player.x, player.y, player.vy, player.dead);
        if (player.dead && player.parts) {
          ctx.strokeStyle = '#ff3333'; ctx.lineWidth = 2;
          player.parts.forEach(pt => {
            ctx.beginPath();
            if (pt.type === 'head') ctx.arc(pt.x, pt.y, 5, 0, Math.PI * 2);
            else { ctx.moveTo(pt.x - 4, pt.y - 4); ctx.lineTo(pt.x + 4, pt.y + 4); }
            ctx.stroke();
          });
        }
      }

      particles.forEach(p => { ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, p.size, p.size); });
      popups.forEach(p => { ctx.fillStyle = p.color; ctx.font = 'bold 18px sans-serif'; ctx.textAlign = 'center'; ctx.fillText(p.text, p.x, p.y); });

      ctx.restore();

      // UI表示
      ctx.fillStyle = '#33ff33'; ctx.font = 'bold 16px monospace'; ctx.textAlign = 'left';
      ctx.fillText(`DEPTH: ${score}m`, 15, 30);
      ctx.fillStyle = '#ffcc00'; ctx.fillText(`RECORD: ${highScore}m`, 15, 50);

      if (currentModeKey === 'ENDLESS' && state === 'PLAY') {
        ctx.fillStyle = '#ffeb3b'; ctx.font = 'bold 14px monospace';
        ctx.fillText(`LEVEL: ${currentLevel}`, 15, 72);
      }

      ctx.fillStyle = '#aaa'; ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'right';
      ctx.fillText(MODES[currentModeKey].name, W - 15, 30);

      // --- タイトル画面 ---
      if (state === 'TITLE') {
        ctx.fillStyle = 'rgba(0,15,0,0.92)'; ctx.fillRect(0, 0, W, H);
        
        ctx.fillStyle = '#33ff66'; ctx.font = 'bold 26px sans-serif'; ctx.textAlign = 'center';
        ctx.fillText('☣️ 沼ゲーのクソゲー', W / 2, 105, W - 40);
        
        ctx.fillStyle = '#aaa'; ctx.font = '13px sans-serif';
        ctx.fillText('〜 モードを選択してスタート 〜', W / 2, 135, W - 40);

        // モード選択ボタンの描画
        modeButtons.forEach(btn => {
          const mode = MODES[btn.key];
          const bw = 290, bh = 52;
          const bx = (W - bw) / 2;
          const by = btn.y;

          ctx.fillStyle = '#112211';
          ctx.fillRect(bx, by, bw, bh);
          ctx.strokeStyle = mode.color;
          ctx.lineWidth = 2;
          ctx.strokeRect(bx, by, bw, bh);

          ctx.fillStyle = mode.color;
          ctx.font = 'bold 15px sans-serif';
          ctx.fillText(mode.name, W / 2, by + 32);
        });

        ctx.fillStyle = '#ff9933'; ctx.font = '12px sans-serif';
        ctx.fillText('⚠️ 泥沼モードは500mごとにレベルアップ！', W / 2, 535, W - 40);
        ctx.fillText('⚠️ ハード/高Lv泥沼は上からの「金タライ」に注意！', W / 2, 555, W - 40);
        ctx.fillStyle = '#888';
        ctx.fillText('👈 左タップ: 左ジャン / 👉 右タップ: 右ジャン', W / 2, 590, W - 40);
      }

      // --- クリア画面 ---
      if (state === 'CLEAR') {
        ctx.fillStyle = 'rgba(0,30,0,0.88)'; ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = '#ffeb3b'; ctx.font = 'bold 30px sans-serif'; ctx.textAlign = 'center';
        ctx.fillText('🎉 CLEAR! 🎉', W / 2, H / 2 - 50);
        
        ctx.fillStyle = '#fff'; ctx.font = '16px sans-serif';
        ctx.fillText(`${MODES[currentModeKey].name} 達成！`, W / 2, H / 2);
        ctx.fillText(`記録: ${score}m`, W / 2, H / 2 + 30);

        ctx.fillStyle = '#33ff66'; ctx.font = 'bold 15px sans-serif';
        ctx.fillText('タップしてメニューに戻る', W / 2, H / 2 + 85);
      }

      // --- ゲームオーバー画面 ---
      if (state === 'GAMEOVER') {
        ctx.fillStyle = 'rgba(15,0,0,0.85)'; ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = '#ff3333'; ctx.font = 'bold 28px sans-serif'; ctx.textAlign = 'center';
        ctx.fillText('💀 死亡！', W / 2, H / 2 - 40);
        ctx.fillStyle = '#fff'; ctx.font = '16px sans-serif';
        ctx.fillText(`到達深さ: ${score}m`, W / 2, H / 2 + 5);
        if (currentModeKey === 'ENDLESS') {
          ctx.fillStyle = '#ffeb3b'; ctx.font = '14px sans-serif';
          ctx.fillText(`到達レベル: Lv.${currentLevel}`, W / 2, H / 2 + 30);
        }
        ctx.fillStyle = '#aaa'; ctx.font = '13px sans-serif';
        ctx.fillText('タップしてメニューに戻る', W / 2, H / 2 + 65);
      }

      ctx.restore();
    }

    function loop() { update(); draw(); requestAnimationFrame(loop); }

    function handleInput(e) {
      if (e) e.preventDefault();
      
      const rect = canvas.getBoundingClientRect();
      const scaleX = W / rect.width;
      const scaleY = H / rect.height;

      let clientX = rect.width / 2;
      let clientY = rect.height / 2;

      if (e.touches && e.touches.length > 0) {
        clientX = e.touches[0].clientX - rect.left;
        clientY = e.touches[0].clientY - rect.top;
      } else if (e.clientX !== undefined) {
        clientX = e.clientX - rect.left;
        clientY = e.clientY - rect.top;
      }

      const canvasX = clientX * scaleX;
      const canvasY = clientY * scaleY;

      if (state === 'TITLE') {
        modeButtons.forEach(btn => {
          const bw = 290, bh = 52;
          const bx = (W - bw) / 2;
          const by = btn.y;

          if (
            canvasX >= bx && canvasX <= bx + bw &&
            canvasY >= by && canvasY <= by + bh
          ) {
            init(btn.key);
            state = 'PLAY';
          }
        });
      } else if (state === 'GAMEOVER' || state === 'CLEAR') { 
        state = 'TITLE';
      } else if (state === 'PLAY') {
        const isLeft = canvasX < (W / 2);
        if (player.jumpsLeft > 0) {
          player.vy = -8.8;
          player.vx = isLeft ? -4.2 : 4.2;

          if (player.jumpsLeft === 1) {
            jumpEffects.push({ x: player.x, y: player.y + 15, r: 5, alpha: 1.0 });
          }

          player.jumpsLeft--;
          playSound('jump');
        }
      }
    }

    window.addEventListener('touchstart', handleInput, { passive: false });
    window.addEventListener('mousedown', handleInput);
    init('NORMAL'); state = 'TITLE'; loop();
  </script>
</body>
</html>
